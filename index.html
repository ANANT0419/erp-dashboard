<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>ERP Dashboard</title><style>
:root{--bg:#F4F5F9;--card:#fff;--ink:#111827;--mut:#6B7280;--line:#E5E7EB}
@media (prefers-color-scheme:dark){:root{--bg:#0B0D14;--card:#151824;--ink:#F3F4F6;--mut:#9CA3AF;--line:#262A3A}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;width:100%;max-width:360px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(135deg,#4F46E5,#7C3AED);
display:grid;place-items:center;font-size:26px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);margin:0 0 18px;font-size:13px}
input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
color:var(--ink);font-size:16px;margin-bottom:10px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#4F46E5;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
label{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);font-size:13px;margin-top:12px}
label input{width:auto;margin:0}
.err{color:#DC2626;font-size:13px;min-height:18px;margin-top:8px}
</style></head><body>
<form id="f"><div class="logo">🔒</div><h1>ERP Dashboard</h1><p>Enter your dashboard password</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
<button>Unlock</button><label><input type="checkbox" id="rem" checked> Remember on this device</label>
<div class="err" id="err"></div></form>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},key,b(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
function saved(){try{return localStorage.getItem("erp_pw")}catch(e){return null}}
const s=saved();
if(s){open(s).catch(()=>{try{localStorage.removeItem("erp_pw")}catch(e){}})}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();const pw=document.getElementById("pw").value,rem=document.getElementById("rem").checked;
  try{await open(pw);if(rem){try{localStorage.setItem("erp_pw",pw)}catch(e){}}}
  catch(x){document.getElementById("err").textContent="Wrong password"}
};
</script></body></html>
